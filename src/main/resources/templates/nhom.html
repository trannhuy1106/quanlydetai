<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý nhóm sinh viên</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    QUẢN LÝ NHÓM SINH VIÊN
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>

                    <h2 style="color:#286092; margin-bottom:6px;">
                        Danh sách nhóm sinh viên
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Quản lý các nhóm sinh viên thực hiện đề tài.
                    </p>

                </div>


                <a th:href="@{/nhom/them}"
                   class="btn">
                    + Thêm nhóm sinh viên
                </a>

            </div>


            <div style="overflow-x:auto;">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Mã nhóm</th>
                        <th>Tên nhóm</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="nhom : ${dsNhom}">

                        <td th:text="${nhom.id}"></td>


                        <td>
                            <strong th:text="${nhom.maNhom}"
                                    style="color:#286092;">
                            </strong>
                        </td>


                        <td th:text="${nhom.tenNhom}"></td>


                        <td th:text="${nhom.moTa}"></td>


                        <td th:text="${nhom.trangThai}"></td>


                        <td>

                            <div class="actions">

                                <a th:href="@{/nhom/sua/{id}(id=${nhom.id})}"
                                   class="btn btn-warning">
                                    Sửa
                                </a>


                                <a th:href="@{/nhom/xoa/{id}(id=${nhom.id})}"
                                   class="btn btn-danger"
                                   onclick="return confirm('Bạn có chắc muốn xóa nhóm này?')">
                                    Xóa
                                </a>

                            </div>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(dsNhom)}">

                        <td colspan="6"
                            style="text-align:center;
                                   padding:30px;
                                   color:#64748b;">

                            Chưa có nhóm sinh viên nào trong hệ thống.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <a th:href="@{/}"
               class="back-link">
                ← Quay lại trang chủ
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>
</html>
