<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sửa bộ môn</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    SỬA BỘ MÔN
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>

                    <h2 style="color:#286092; margin-bottom:6px;">
                        Cập nhật thông tin bộ môn
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Chỉnh sửa thông tin bộ môn thuộc Khoa Công nghệ thông tin.
                    </p>

                </div>

            </div>


            <form th:action="@{/bomon/sua/{id}(id=${boMon.id})}"
                  method="post">


                <p>

                    <label for="maBoMon">
                        Mã bộ môn
                    </label>

                    <input type="text"
                           id="maBoMon"
                           name="maBoMon"
                           th:value="${boMon.maBoMon}"
                           required>

                </p>


                <p>

                    <label for="tenBoMon">
                        Tên bộ môn
                    </label>

                    <input type="text"
                           id="tenBoMon"
                           name="tenBoMon"
                           th:value="${boMon.tenBoMon}"
                           required>

                </p>


                <p>

                    <label for="trangThai">
                        Trạng thái
                    </label>

                    <select id="trangThai"
                            name="trangThai"
                            required>

                        <option value="HOAT_DONG"
                                th:selected="${boMon.trangThai == 'HOAT_DONG'}">
                            Hoạt động
                        </option>

                        <option value="NGUNG_HOAT_DONG"
                                th:selected="${boMon.trangThai == 'NGUNG_HOAT_DONG'}">
                            Ngừng hoạt động
                        </option>

                    </select>

                </p>


                <div style="background:#fffbea;
                            border-left:4px solid #f2c94c;
                            padding:12px 15px;
                            margin:15px 0 20px;
                            font-size:14px;
                            color:#555;">

                    Mỗi bộ môn có một
                    <strong>mã bộ môn duy nhất</strong>
                    trong hệ thống.

                </div>


                <div class="actions">

                    <button type="submit">
                        Lưu thay đổi
                    </button>

                    <a th:href="@{/bomon}"
                       class="btn"
                       style="background:#6c757d;">
                        Hủy
                    </a>

                </div>

            </form>


            <a th:href="@{/bomon}"
               class="back-link">
                ← Quay lại danh sách bộ môn
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>
</html>
