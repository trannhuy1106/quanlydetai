<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Hệ thống quản lý đề tài</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(74, 144, 205, 0.35),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(242, 201, 76, 0.18),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #0c3155 0%,
                    #174f7e 48%,
                    #286092 100%
                );
        }

        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            position: relative;
        }

        /* =========================
           HÌNH TRANG TRÍ NỀN
        ========================= */

        .shape {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .shape-1 {
            width: 360px;
            height: 360px;

            background: rgba(255, 255, 255, 0.06);

            top: -140px;
            left: -110px;
        }

        .shape-2 {
            width: 250px;
            height: 250px;

            border: 35px solid rgba(255, 255, 255, 0.04);

            right: -70px;
            bottom: -70px;
        }

        .shape-3 {
            width: 100px;
            height: 100px;

            background: rgba(242, 201, 76, 0.10);

            right: 16%;
            top: 12%;
        }

        /* =========================
           KHUNG ĐĂNG NHẬP
        ========================= */

        .login-container {
            width: 100%;
            max-width: 480px;

            position: relative;
            z-index: 2;

            background: white;

            border-radius: 22px;
            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.4);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.28),
                0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           HEADER
        ========================= */

        .login-header {
            position: relative;

            text-align: center;
            color: white;

            padding: 30px 30px 31px;

            background:
                linear-gradient(
                    135deg,
                    #1c527f 0%,
                    #286092 55%,
                    #3974a7 100%
                );
        }

        .login-header::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #f2c94c,
                    #ffe28a,
                    #f2c94c
                );
        }

        /* =========================
           LOGO
        ========================= */

        .login-logo {
            width: 175px;
            height: 110px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(
                    0 6px 12px rgba(0, 0, 0, 0.18)
                );
        }

        .login-header h1 {
            margin: 0 0 8px;

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .login-header p {
            margin: 0;

            font-size: 12px;

            color: rgba(255, 255, 255, 0.86);

            line-height: 1.5;
        }

        /* =========================
           NỘI DUNG
        ========================= */

        .login-box {
            padding: 36px 38px 30px;

            background: white;
        }

        .login-title {
            margin: 0 0 7px;

            text-align: center;

            color: #244e74;

            font-size: 22px;
            font-weight: 700;
        }

        .login-subtitle {
            margin: 0 0 29px;

            text-align: center;

            color: #8493a3;

            font-size: 13px;
        }

        /* =========================
           THÔNG BÁO LỖI
        ========================= */

        .login-error {
            margin-bottom: 20px;

            padding: 12px 14px;

            background: #fff5f5;

            border: 1px solid #ffc9c9;
            border-left: 4px solid #dc3545;

            border-radius: 8px;

            color: #b42318;

            font-size: 13px;
            font-weight: 600;
        }

        /* =========================
           FORM
        ========================= */

        .login-form {
            width: 100%;
        }

        .login-group {
            margin-bottom: 20px;
        }

        .login-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        /* =========================
           ICON
        ========================= */

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            width: 20px;
            height: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #7890a7;

            pointer-events: none;
        }

        .input-icon svg {
            width: 19px;
            height: 19px;
        }

        /* =========================
           INPUT
        ========================= */

        .login-group input {
            width: 100%;
            height: 50px;

            padding: 0 15px 0 47px;

            border: 1px solid #d9e2eb;

            border-radius: 10px;

            background: #f7f9fc;

            color: #253648;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s,
                background 0.25s,
                box-shadow 0.25s;
        }

        .login-group input::placeholder {
            color: #a0adba;
        }

        .login-group input:hover {
            border-color: #b8c8d8;
        }

        .login-group input:focus {
            background: white;

            border-color: #3474aa;

            box-shadow:
                0 0 0 4px rgba(40, 96, 146, 0.10);
        }

        /* =========================
           BUTTON
        ========================= */

        .login-button {
            width: 100%;
            height: 51px;

            margin-top: 6px;

            border: none;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #286092,
                    #3978ad
                );

            color: white;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.3px;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(40, 96, 146, 0.24);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #1f4d76,
                    #3474aa
                );

            box-shadow:
                0 12px 25px rgba(40, 96, 146, 0.32);
        }

        .login-button:active {
            transform: translateY(0);

            box-shadow:
                0 5px 12px rgba(40, 96, 146, 0.20);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer-line {
            width: 45px;
            height: 3px;

            margin: 18px auto 13px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #e5b82f,
                    #f2c94c
                );
        }

        .login-footer {
            text-align: center;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.7;
        }

        .login-footer strong {
            color: #52718d;

            font-weight: 700;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 550px) {

            body {
                overflow: auto;
            }

            .login-page {
                padding: 20px 15px;
            }

            .login-container {
                max-width: 100%;

                border-radius: 18px;
            }

            .login-header {
                padding: 25px 20px 27px;
            }

            .login-logo {
                width: 150px;
                height: 95px;

                margin-bottom: 10px;
            }

            .login-header h1 {
                font-size: 18px;
            }

            .login-header p {
                font-size: 11px;
            }

            .login-box {
                padding: 29px 24px 24px;
            }

            .login-title {
                font-size: 20px;
            }

            .shape-1 {
                width: 250px;
                height: 250px;
            }

            .shape-2 {
                width: 180px;
                height: 180px;
            }

            .shape-3 {
                display: none;
            }
        }

    </style>

</head>


<body>

<div class="login-page">

    <!-- HÌNH TRANG TRÍ NỀN -->

    <div class="shape shape-1"></div>

    <div class="shape shape-2"></div>

    <div class="shape shape-3"></div>


    <!-- KHUNG ĐĂNG NHẬP -->

    <div class="login-container">


        <!-- HEADER -->

        <div class="login-header">

            <div class="login-logo">

                <img th:src="@{/images/ute_logo.png}"
                     src="/images/ute_logo.png"
                     alt="Logo HCMUTE">

            </div>


            <h1>
                HỆ THỐNG QUẢN LÝ ĐỀ TÀI
            </h1>


            <p>
                TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM
            </p>

        </div>


        <!-- PHẦN FORM -->

        <div class="login-box">


            <h2 class="login-title">
                Đăng nhập hệ thống
            </h2>


            <p class="login-subtitle">
                Chào mừng bạn quay trở lại
            </p>


            <!-- THÔNG BÁO LỖI -->

            <div th:if="${loi != null}"
                 class="login-error"
                 th:text="${loi}">
            </div>


            <!-- FORM ĐĂNG NHẬP -->

            <form th:action="@{/dangnhap}"
                  method="post"
                  class="login-form">


                <!-- TÊN ĐĂNG NHẬP -->

                <div class="login-group">

                    <label for="tenDangNhap">
                        Tên đăng nhập
                    </label>


                    <div class="input-wrapper">


                        <!-- ICON USER -->

                        <span class="input-icon">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <circle cx="12"
                                        cy="8"
                                        r="4">
                                </circle>

                                <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8">
                                </path>

                            </svg>

                        </span>


                        <input type="text"
                               id="tenDangNhap"
                               name="tenDangNhap"
                               placeholder="Nhập tên đăng nhập"
                               autocomplete="username"
                               required>

                    </div>

                </div>


                <!-- MẬT KHẨU -->

                <div class="login-group">

                    <label for="matKhau">
                        Mật khẩu
                    </label>


                    <div class="input-wrapper">


                        <!-- ICON LOCK -->

                        <span class="input-icon">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">

                                <rect x="4"
                                      y="10"
                                      width="16"
                                      height="11"
                                      rx="2">
                                </rect>

                                <path d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                        </span>


                        <input type="password"
                               id="matKhau"
                               name="matKhau"
                               placeholder="Nhập mật khẩu"
                               autocomplete="current-password"
                               required>

                    </div>

                </div>


                <!-- BUTTON -->

                <button type="submit"
                        class="login-button">

                    ĐĂNG NHẬP

                </button>

            </form>


            <!-- FOOTER -->

            <div class="footer-line"></div>


            <div class="login-footer">

                Hệ thống quản lý đề tài sinh viên

                <br>

                <strong>
                    HCMUTE
                </strong>

            </div>


        </div>

    </div>

</div>

</body>

</html>
