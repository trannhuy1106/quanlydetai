<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thêm thành viên hội đồng</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    THÊM THÀNH VIÊN HỘI ĐỒNG
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>

                    <h2 style="color:#286092; margin-bottom:6px;">
                        Thêm giảng viên vào hội đồng
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Chọn giảng viên và vai trò trong hội đồng phản biện.
                    </p>

                </div>

            </div>


            <!-- THÔNG TIN HỘI ĐỒNG -->

            <div style="background:white;
                        border:1px solid #ddd;
                        padding:18px 20px;
                        margin-bottom:20px;
                        border-radius:4px;
                        max-width:850px;">

                <div style="font-size:14px;
                            color:#64748b;
                            margin-bottom:6px;">
                    Hội đồng
                </div>

                <div style="font-size:18px;
                            font-weight:700;
                            color:#286092;"
                     th:text="${hoiDong.maHoiDong + ' - ' + hoiDong.tenHoiDong}">
                </div>

            </div>


            <!-- THÔNG BÁO LỖI -->

            <div th:if="${loi != null}"
                 style="max-width:850px;
                        background:#fff3f3;
                        border:1px solid #f1b5b5;
                        color:#b42318;
                        padding:14px 16px;
                        border-radius:4px;
                        margin-bottom:20px;
                        font-weight:600;"
                 th:text="${loi}">
            </div>


            <!-- FORM -->

            <form th:action="@{/hoidong/{id}/thanhvien/them(id=${hoiDong.id})}"
                  method="post">


                <p>

                    <label for="giangVienId">
                        Giảng viên
                    </label>

                    <select id="giangVienId"
                            name="giangVienId"
                            required>

                        <option value="">
                            -- Chọn giảng viên --
                        </option>

                        <option th:each="gv : ${dsGiangVien}"
                                th:value="${gv.id}"
                                th:text="${gv.maGv + ' - ' + gv.hoTen}">
                        </option>

                    </select>

                </p>


                <p>

                    <label for="vaiTro">
                        Vai trò trong hội đồng
                    </label>

                    <select id="vaiTro"
                            name="vaiTro"
                            required>

                        <option value="">
                            -- Chọn vai trò --
                        </option>

                        <option value="CHU_TICH">
                            Chủ tịch
                        </option>

                        <option value="THU_KY">
                            Thư ký
                        </option>

                        <option value="THANH_VIEN">
                            Thành viên
                        </option>

                    </select>

                </p>


                <!-- LƯU Ý -->

                <div style="background:#fffbea;
                            border-left:4px solid #f2c94c;
                            padding:12px 15px;
                            margin:15px 0 20px;
                            font-size:14px;
                            color:#555;">

                    Mỗi hội đồng có tối đa
                    <strong>5 giảng viên</strong>.

                    <br><br>

                    Mỗi hội đồng chỉ có
                    <strong>1 Chủ tịch</strong>
                    và
                    <strong>1 Thư ký</strong>.

                </div>


                <div class="actions">

                    <button type="submit">
                        + Thêm vào hội đồng
                    </button>

                    <a th:href="@{/hoidong/{id}/thanhvien(id=${hoiDong.id})}"
                       class="btn"
                       style="background:#6c757d;">
                        Hủy
                    </a>

                </div>

            </form>


            <a th:href="@{/hoidong/{id}/thanhvien(id=${hoiDong.id})}"
               class="back-link">
                ← Quay lại danh sách thành viên
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>
</html>
