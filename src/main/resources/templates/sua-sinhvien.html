<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sửa sinh viên</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">
                <div class="page-title-label">
                    SỬA SINH VIÊN
                </div>

                <div class="page-title-line"></div>
            </div>


            <div class="page-header">

                <div>
                    <h2 style="color:#286092; margin-bottom:6px;">
                        Cập nhật thông tin sinh viên
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Chỉnh sửa thông tin sinh viên trong hệ thống.
                    </p>
                </div>

            </div>


            <form th:action="@{/sinhvien/sua/{id}(id=${sinhVien.id})}"
                  method="post">


                <p>
                    <label for="maSv">
                        Mã sinh viên
                    </label>

                    <input type="text"
                           id="maSv"
                           name="maSv"
                           th:value="${sinhVien.maSv}"
                           required>
                </p>


                <p>
                    <label for="hoTen">
                        Họ và tên
                    </label>

                    <input type="text"
                           id="hoTen"
                           name="hoTen"
                           th:value="${sinhVien.hoTen}"
                           required>
                </p>


                <p>
                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${sinhVien.email}">
                </p>


                <p>
                    <label for="lop">
                        Lớp
                    </label>

                    <input type="text"
                           id="lop"
                           name="lop"
                           th:value="${sinhVien.lop}">
                </p>


                <p>
                    <label for="nganh">
                        Ngành
                    </label>

                    <input type="text"
                           id="nganh"
                           name="nganh"
                           th:value="${sinhVien.nganh}">
                </p>


                <p>
                    <label for="trangThai">
                        Trạng thái
                    </label>

                    <select id="trangThai"
                            name="trangThai">

                        <option value="DANG_HOC"
                                th:selected="${sinhVien.trangThai == 'DANG_HOC'}">
                            Đang học
                        </option>

                        <option value="BAO_LUU"
                                th:selected="${sinhVien.trangThai == 'BAO_LUU'}">
                            Bảo lưu
                        </option>

                        <option value="DA_TOT_NGHIEP"
                                th:selected="${sinhVien.trangThai == 'DA_TOT_NGHIEP'}">
                            Đã tốt nghiệp
                        </option>

                    </select>
                </p>


                <div class="actions">

                    <button type="submit">
                        Lưu thay đổi
                    </button>

                    <a th:href="@{/sinhvien}"
                       class="btn"
                       style="background:#6c757d;">
                        Hủy
                    </a>

                </div>

            </form>


            <a th:href="@{/sinhvien}"
               class="back-link">
                ← Quay lại danh sách sinh viên
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>
</html>
