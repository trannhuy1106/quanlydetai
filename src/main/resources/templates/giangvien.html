<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý giảng viên</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    QUẢN LÝ GIẢNG VIÊN
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>
                    <h2 style="color:#286092; margin-bottom:6px;">
                        Danh sách giảng viên
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Quản lý thông tin giảng viên trong hệ thống.
                    </p>
                </div>


                <a th:href="@{/giangvien/them}"
                   class="btn">
                    + Thêm giảng viên
                </a>

            </div>


            <div style="overflow-x:auto;">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Mã giảng viên</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Bộ môn</th>
                        <th>Học vị</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="gv : ${dsGiangVien}">

                        <td th:text="${gv.id}"></td>


                        <td>
                            <strong th:text="${gv.maGv}"
                                    style="color:#286092;">
                            </strong>
                        </td>


                        <td th:text="${gv.hoTen}"></td>


                        <td th:text="${gv.email}"></td>


                        <td th:text="${gv.boMon}"></td>


                        <td th:text="${gv.hocVi}"></td>


                        <td th:text="${gv.trangThai}"></td>


                        <td>

                            <div class="actions">

                                <a th:href="@{/giangvien/sua/{id}(id=${gv.id})}"
                                   class="btn btn-warning">
                                    Sửa
                                </a>


                                <a th:href="@{/giangvien/xoa/{id}(id=${gv.id})}"
                                   class="btn btn-danger"
                                   onclick="return confirm('Bạn có chắc muốn xóa giảng viên này?')">
                                    Xóa
                                </a>

                            </div>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(dsGiangVien)}">

                        <td colspan="8"
                            style="text-align:center;
                                   padding:30px;
                                   color:#64748b;">

                            Chưa có giảng viên nào trong hệ thống.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <a th:href="@{/}"
               class="back-link">
                ← Quay lại trang chủ
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>

</html>
