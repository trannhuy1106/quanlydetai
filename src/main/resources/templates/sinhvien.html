<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    QUẢN LÝ SINH VIÊN
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>

                    <h2 style="color:#286092; margin-bottom:6px;">
                        Danh sách sinh viên
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Quản lý thông tin sinh viên trong hệ thống.
                    </p>

                </div>


                <a th:href="@{/sinhvien/them}"
                   class="btn">
                    + Thêm sinh viên
                </a>

            </div>


            <div style="overflow-x:auto;">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Mã sinh viên</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Lớp</th>
                        <th>Ngành</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="sv : ${dsSinhVien}">

                        <td th:text="${sv.id}"></td>


                        <td>
                            <strong th:text="${sv.maSv}"
                                    style="color:#286092;">
                            </strong>
                        </td>


                        <td th:text="${sv.hoTen}"></td>


                        <td th:text="${sv.email}"></td>


                        <td th:text="${sv.lop}"></td>


                        <td th:text="${sv.nganh}"></td>


                        <td th:text="${sv.trangThai}"></td>


                        <td>

                            <div class="actions">

                                <a th:href="@{/sinhvien/sua/{id}(id=${sv.id})}"
                                   class="btn btn-warning">
                                    Sửa
                                </a>


                                <a th:href="@{/sinhvien/xoa/{id}(id=${sv.id})}"
                                   class="btn btn-danger"
                                   onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?')">
                                    Xóa
                                </a>

                            </div>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(dsSinhVien)}">

                        <td colspan="8"
                            style="text-align:center;
                                   padding:30px;
                                   color:#64748b;">

                            Chưa có sinh viên nào trong hệ thống.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <a th:href="@{/}"
               class="back-link">
                ← Quay lại trang chủ
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>

</html>
