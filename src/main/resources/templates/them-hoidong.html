<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tạo hội đồng phản biện</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main">

        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="content">

            <div class="page-title">

                <div class="page-title-label">
                    TẠO HỘI ĐỒNG PHẢN BIỆN
                </div>

                <div class="page-title-line"></div>

            </div>


            <div class="page-header">

                <div>

                    <h2 style="color:#286092; margin-bottom:6px;">
                        Thông tin hội đồng
                    </h2>

                    <p style="color:#64748b; font-size:14px;">
                        Nhập thông tin và chọn đề tài cần thành lập hội đồng phản biện.
                    </p>

                </div>

            </div>


            <form th:action="@{/hoidong/them}"
                  method="post">


                <p>

                    <label for="maHoiDong">
                        Mã hội đồng
                    </label>

                    <input type="text"
                           id="maHoiDong"
                           name="maHoiDong"
                           placeholder="Ví dụ: HD001"
                           required>

                </p>


                <p>

                    <label for="tenHoiDong">
                        Tên hội đồng
                    </label>

                    <input type="text"
                           id="tenHoiDong"
                           name="tenHoiDong"
                           placeholder="Ví dụ: Hội đồng phản biện 01"
                           required>

                </p>


                <p>

                    <label for="deTaiId">
                        Đề tài phản biện
                    </label>

                    <select id="deTaiId"
                            name="deTaiId"
                            required>

                        <option value="">
                            -- Chọn đề tài --
                        </option>

                        <option th:each="dt : ${dsDeTai}"
                                th:value="${dt.id}"
                                th:text="${dt.maDeTai + ' - ' + dt.tenDeTai}">
                        </option>

                    </select>

                </p>


                <p>

                    <label for="ngayBaoCao">
                        Ngày báo cáo
                    </label>

                    <input type="date"
                           id="ngayBaoCao"
                           name="ngayBaoCao"
                           required>

                </p>


                <p>

                    <label for="diaDiem">
                        Địa điểm
                    </label>

                    <input type="text"
                           id="diaDiem"
                           name="diaDiem"
                           placeholder="Ví dụ: Phòng A101"
                           required>

                </p>


                <div style="background:#fffbea;
                            border-left:4px solid #f2c94c;
                            padding:12px 15px;
                            margin:15px 0 20px;
                            max-width:850px;
                            font-size:14px;
                            color:#555;">

                    Sau khi tạo hội đồng, vào mục
                    <strong>Thành viên</strong>
                    để thêm giảng viên và phân vai trò
                    <strong>Chủ tịch, Thư ký, Thành viên</strong>.

                </div>


                <div class="actions">

                    <button type="submit">
                        + Tạo hội đồng
                    </button>

                    <a th:href="@{/hoidong}"
                       class="btn"
                       style="background:#6c757d;">
                        Hủy
                    </a>

                </div>

            </form>


            <a th:href="@{/hoidong}"
               class="back-link">
                ← Quay lại danh sách hội đồng
            </a>

        </div>


        <footer class="footer">
            Hệ thống quản lý đề tài - HCMUTE
        </footer>

    </main>

</div>

</body>
</html>
